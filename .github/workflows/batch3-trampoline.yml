name: batch3-trampoline
# Heartbeat for the batch-3 ingestion chain. This file lives on main ONLY
# because GitHub cron fires exclusively from the default branch — its sole
# job is to dispatch ingest-chunk.yml on the ingestion branch. It runs no
# agent, reads no knowledge, and writes nothing to main.
#
# Added with Cameron's explicit permission (2026-08-17), replacing
# batch2-trampoline.yml (whose worklist is exhausted, so it had become an
# hourly no-op). DELETE THIS FILE at Gate B.
#
# WHY A SHORT CRON IS SAFE: ingest-chunk.yml's preflight exits silently when
# another run of itself is already in flight, so extra fires are no-ops. That
# makes this a pure safety net — it restarts a dead chain within ~15 minutes
# instead of up to an hour — while the real throughput lever is the
# `pace_minutes` input below.
#
# PACING (edit these two values to change the rate; takes effect on the next
# chain this trampoline starts, not on one already running):
#   chunk_size    videos processed per run
#   pace_minutes  idle wait before the run dispatches the next chunk; 0 = flat
#                 out. Single-lane ceiling is ~8.8 videos/hour at batch-2's
#                 ~6.8 min/video, so pace_minutes=0 is as fast as one chain
#                 goes — beyond that needs parallel lanes, which multiplies
#                 the burn rate proportionally.
#
# Kill switch: commit a file named STOP at the root of the ingestion branch.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}
permissions:
  actions: write
jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch ingest-chunk on the batch-3 branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh workflow run ingest-chunk.yml \
            --ref claude/batch-3-planning-lessons-pxwdl5 \
            -f chunk_size=5 \
            -f pace_minutes=45 \
            -f chain_count=0 \
            -f redispatch=true
