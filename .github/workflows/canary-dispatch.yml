name: batch2-canary-dispatch
# TEMPORARY bootstrap (Cameron-approved canary path, 2026-08-13). Fires on a
# push touching .github/CANARY-KICK and dispatches the N=1 canary via
# workflow_dispatch — claude-code-action rejects push events ("Unsupported
# event type: push", canary attempt 1), so the canary must arrive as a
# workflow_dispatch run. This uses the same mechanism (gh workflow run +
# GITHUB_TOKEN + --ref on the non-default branch) as the trampoline on main
# and the chain's self-re-dispatch, so a green dispatch here validates that
# mechanism end-to-end. DELETED together with .github/CANARY-KICK as soon as
# the canary is verified.
on:
  push:
    branches: [claude/batch2-ingestion-rb0v4i]
    paths: [".github/CANARY-KICK"]

permissions:
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch N=1 canary (workflow_dispatch)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh workflow run ingest-chunk.yml \
            --ref claude/batch2-ingestion-rb0v4i \
            -f chunk_size=1 -f chain_count=0 -f redispatch=false
          echo "Canary dispatched."
