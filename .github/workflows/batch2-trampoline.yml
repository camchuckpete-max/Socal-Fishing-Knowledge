name: batch2-trampoline
# Heartbeat for the batch-2 ingestion chain (lives on main so GitHub cron
# fires; cron only runs from the default branch). Its ONLY job is to
# dispatch ingest-chunk.yml on the ingestion branch. All guards (STOP
# file, empty worklist, concurrency) live in that workflow's preflight,
# so a spurious dispatch is a no-op.
# Added with Cameron's explicit one-time permission (2026-08-13) — the
# only agent write to main in the batch-2 pipeline. DELETE THIS FILE at
# Gate B.
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch: {}
permissions:
  actions: write
jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch ingest-chunk on the ingestion branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run ingest-chunk.yml --ref claude/batch2-ingestion-rb0v4i
