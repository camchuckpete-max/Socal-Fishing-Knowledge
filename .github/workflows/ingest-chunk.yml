name: batch3-ingest-chunk
# Unattended batch-3 ingestion chunk runner. Lives ONLY on the batch-3
# branch; nothing here ever writes to main.
#
# PACING. This chain sustains itself by self-re-dispatch — it does NOT need a
# cron trampoline on main. `pace_minutes` is the throughput lever: the run
# sleeps that long before dispatching the next chunk, so the effective rate is
# chunk_size videos per (processing time + pace_minutes). Set pace_minutes=0
# for maximum throughput.
#
# Kill switch: a file named STOP at the branch root — preflight exits silently.

on:
  workflow_dispatch:
    inputs:
      chunk_size:
        description: "Rows to process this run"
        type: string
        default: "5"
      pace_minutes:
        description: "Minutes to wait before dispatching the next chunk (0 = flat out)"
        type: string
        default: "45"
      chain_count:
        description: "Self-dispatch depth (leave 0)"
        type: string
        default: "0"
      redispatch:
        description: "Re-dispatch when rows remain"
        type: string
        default: "true"

concurrency:
  group: batch3-ingest
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      BRANCH: claude/batch-3-planning-lessons-pxwdl5
      # Throughput lever, authoritative over the dispatch input.
      #
      # The chain re-dispatches ITSELF and passes its own inherited
      # pace_minutes forward, so changing the trampoline alone does nothing
      # until the chain happens to die. This env is read from the branch on
      # every chunk, so a change here takes effect on the very next one.
      #
      # 0 = no idle wait. Measured over the first 163 videos: 72% of wall
      # clock was this sleep, not work (median 4.7 min of real processing per
      # video against a 51 min median gap between chunks). Removing it changes
      # nothing about how a video is processed — same depth, same evaluator,
      # same guard — it only stops the chain sleeping between chunks.
      PACE_OVERRIDE: "0"
      # Videos per run, authoritative over the dispatch input for the same
      # reason as PACE_OVERRIDE (the chain passes its own value forward).
      #
      # Raised 5 -> 20 on 2026-08-20. The only thing chunk size amortizes is
      # the ~6 min lag between a re-dispatch and the next run actually
      # starting; in-job overhead is ~7 seconds. So this is worth ~14%, not
      # more.
      #
      # It does NOT squeeze the agents. --max-turns below is the
      # ORCHESTRATOR's budget, and the orchestrator spends ~5-6 turns per
      # video (reset, spawn extractor, spawn evaluator, commit). The
      # extractor and evaluator are Task subagents with their own fresh
      # contexts and their own budgets, untouched by this number. 20 videos
      # is ~120 orchestrator turns against 400.
      #
      # Bounded by the agent step's timeout-minutes: 300 against ~5.8
      # min/video measured, so 20 videos (~116 min) has ample headroom. A
      # chunk that dies partway keeps its finished videos — each commits and
      # pushes individually.
      CHUNK_OVERRIDE: "20"
    steps:
      - name: Checkout ingestion branch
        uses: actions/checkout@v4
        with:
          ref: claude/batch-3-planning-lessons-pxwdl5
          fetch-depth: 0

      - name: Preflight guards
        id: preflight
        env:
          HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
          HAS_OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -f STOP ]; then
            echo "STOP file present — exiting silently (Cameron's kill switch)."
            echo "proceed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          pending=$(python scripts/next-video.py --count)
          echo "pending=$pending"
          if [ "$pending" = "0" ]; then
            echo "Worklist empty — batch complete."
            echo "proceed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$HAS_KEY" != "true" ] && [ "$HAS_OAUTH" != "true" ]; then
            echo "::error::No auth secret found (ANTHROPIC_API_KEY / CLAUDE_CODE_OAUTH_TOKEN)."
            exit 1
          fi
          # Overlap guard. The trampoline on main fires on a short cron so a
          # dead chain restarts fast; without this, every fire would queue
          # behind the running chunk and the pacing lever would be defeated.
          # This run counts itself, hence > 1.
          others=$(gh run list --workflow=ingest-chunk.yml --status=in_progress \
                     --json databaseId --jq 'length' 2>/dev/null || echo 1)
          if [ "${others:-1}" -gt 1 ]; then
            echo "Another chunk is already in flight — exiting (no overlap)."
            echo "proceed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "run_base=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "proceed=true" >> "$GITHUB_OUTPUT"

      - name: Git identity
        if: steps.preflight.outputs.proceed == 'true'
        run: |
          git config user.name "batch3-ingest[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run orchestrator (extract -> evaluate -> commit per video)
        if: steps.preflight.outputs.proceed == 'true'
        timeout-minutes: 300
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          allowed_bots: "github-actions,github-actions[bot]"
          prompt: |
            Read prompts/orchestrate-chunk.md and follow it exactly.
            CHUNK_SIZE=${CHUNK_OVERRIDE:-${{ inputs.chunk_size }}}.
          claude_args: >-
            --model claude-sonnet-5
            --max-turns 800
            --allowedTools "Bash(git:*),Bash(python:*),Bash(python3:*),Bash(bash:*),Bash(wc:*),Bash(scripts/*),Read,Grep,Glob,Edit,Write,Task"

      - name: Mechanical guard sweep (re-check every commit this run)
        if: always() && steps.preflight.outputs.proceed == 'true'
        run: |
          set -euo pipefail
          python scripts/batch2/guard.py sweep --base "${{ steps.preflight.outputs.run_base }}"
          git push origin "HEAD:$BRANCH" || (git pull --rebase origin "$BRANCH" && git push origin "HEAD:$BRANCH")

      - name: Progress checkpoint
        if: always() && steps.preflight.outputs.proceed == 'true'
        run: |
          set -euo pipefail
          python scripts/batch2/progress.py || true
          if ! git diff --quiet; then
            git add -A
            git commit -m "batch3: progress checkpoint"
            git push origin "HEAD:$BRANCH" || (git pull --rebase origin "$BRANCH" && git push origin "HEAD:$BRANCH")
          fi

      - name: Pace, then re-dispatch next chunk
        if: always() && steps.preflight.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "${{ inputs.redispatch }}" != "true" ]; then
            echo "redispatch=false — stopping here."; exit 0
          fi
          if [ -f STOP ]; then echo "STOP appeared — not re-dispatching."; exit 0; fi
          pending=$(python scripts/next-video.py --count)
          if [ "$pending" = "0" ]; then echo "Worklist empty — chain complete."; exit 0; fi
          chain=${{ inputs.chain_count }}
          if [ "$chain" -ge 200 ]; then
            echo "::warning::chain_count cap (200) reached — not re-dispatching."; exit 0
          fi
          real=$(git rev-list --count --invert-grep --grep='^batch3: progress checkpoint' "${{ steps.preflight.outputs.run_base }}..HEAD")
          if [ "$real" = "0" ]; then
            echo "::warning::Zero non-checkpoint commits this run (API outage / agent failure)."
            echo "Not self-re-dispatching — a human or a later manual dispatch must resume."
            exit 0
          fi
          pace="${PACE_OVERRIDE:-${{ inputs.pace_minutes }}}"
          if [ "$pace" -gt 0 ]; then
            echo "Pacing: sleeping ${pace} minute(s) before the next chunk."
            sleep $(( pace * 60 ))
          fi
          if [ -f STOP ]; then echo "STOP appeared during pause — not re-dispatching."; exit 0; fi
          for delay in 0 10 30 90; do
            sleep "$delay"
            if gh workflow run ingest-chunk.yml --ref "$BRANCH" \
                 -f chunk_size="${CHUNK_OVERRIDE:-${{ inputs.chunk_size }}}" \
                 -f pace_minutes="${{ inputs.pace_minutes }}" \
                 -f chain_count="$((chain + 1))" \
                 -f redispatch=true; then
              echo "Re-dispatched (chain depth $((chain + 1)))."; exit 0
            fi
          done
          echo "::warning::Re-dispatch failed after retries — chain has stalled."
