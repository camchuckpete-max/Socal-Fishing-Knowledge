name: review-chunk
# Unattended editorial-review chunk runner (sources/plan-review.md). Lives
# ONLY on the review branch; nothing here ever writes to main. Clone of the
# battle-tested batch-3 ingest-chunk.yml with the review's worklist, prompts,
# and guard.
#
# The chain sustains itself by self-re-dispatch. Phases (transform ->
# relocations -> gazetteer -> fact-check -> cluster consistency) roll
# automatically: scripts/review/next-note.py derives the active phase from
# worklist state, so this file never changes between phases.
#
# Kill switch: a file named STOP at the branch root — preflight exits
# silently.

on:
  workflow_dispatch:
    inputs:
      chunk_budget:
        description: "Points per run (full=5 standard=2 light=1 gazetteer=2 cluster=3 relocate=1)"
        type: string
        default: "16"
      pace_minutes:
        description: "Minutes to wait before dispatching the next chunk (0 = flat out)"
        type: string
        default: "0"
      chain_count:
        description: "Self-dispatch depth (leave 0)"
        type: string
        default: "0"
      redispatch:
        description: "Re-dispatch when rows remain"
        type: string
        default: "true"

concurrency:
  group: kb-review
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      BRANCH: claude/knowledge-base-review-g00k8s
      # Authoritative over the dispatch inputs (the chain passes its own
      # values forward, so an env change here takes effect next chunk —
      # same mechanism as batch 3).
      PACE_OVERRIDE: "0"
      BUDGET_OVERRIDE: "16"
      # Fleet model (Cameron, 2026-08-24): Opus 5 — this is fidelity-critical
      # rewriting, and the verifier runs on the same model as the worker. When
      # the worklist reaches the light-tier tackle tail (86 formulaic product
      # notes), flip this to claude-sonnet-5 with a one-line branch edit; the
      # next chunk picks it up (same authoritative-override mechanism as
      # PACE_OVERRIDE).
      MODEL_OVERRIDE: "claude-opus-5"
    steps:
      - name: Checkout review branch
        uses: actions/checkout@v4
        with:
          ref: claude/knowledge-base-review-g00k8s
          fetch-depth: 0

      - name: Preflight guards
        id: preflight
        env:
          HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
          HAS_OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -f STOP ]; then
            echo "STOP file present — exiting silently (Cameron's kill switch)."
            echo "proceed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          pending=$(python scripts/review/next-note.py --count)
          echo "actionable=$pending"
          if [ "$pending" = "0" ]; then
            echo "Worklist drained — review fleet complete."
            echo "proceed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$HAS_KEY" != "true" ] && [ "$HAS_OAUTH" != "true" ]; then
            echo "::error::No auth secret found (ANTHROPIC_API_KEY / CLAUDE_CODE_OAUTH_TOKEN)."
            exit 1
          fi
          others=$(gh run list --workflow=review-chunk.yml --status=in_progress \
                     --json databaseId --jq 'length' 2>/dev/null || echo 1)
          if [ "${others:-1}" -gt 1 ]; then
            echo "Another chunk is already in flight — exiting (no overlap)."
            echo "proceed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "run_base=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "proceed=true" >> "$GITHUB_OUTPUT"

      - name: Git identity
        if: steps.preflight.outputs.proceed == 'true'
        run: |
          git config user.name "kb-review[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run orchestrator (worker -> verify -> commit per unit)
        if: steps.preflight.outputs.proceed == 'true'
        timeout-minutes: 300
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          allowed_bots: "github-actions,github-actions[bot]"
          prompt: |
            Read prompts/orchestrate-review-chunk.md and follow it exactly.
            CHUNK_BUDGET=${BUDGET_OVERRIDE:-${{ inputs.chunk_budget }}}.
          claude_args: >-
            --model ${{ env.MODEL_OVERRIDE || 'claude-opus-5' }}
            --max-turns 800
            --allowedTools "Bash(git:*),Bash(python:*),Bash(python3:*),Bash(bash:*),Bash(wc:*),Bash(ls:*),Bash(scripts/*),Read,Grep,Glob,Edit,Write,Task"

      - name: Mechanical guard sweep (re-check every commit this run)
        if: always() && steps.preflight.outputs.proceed == 'true'
        run: |
          set -euo pipefail
          python scripts/review/guard.py sweep --base "${{ steps.preflight.outputs.run_base }}"
          git push origin "HEAD:$BRANCH" || (git pull --rebase origin "$BRANCH" && git push origin "HEAD:$BRANCH")

      - name: Progress checkpoint (+ phase builders, self-sequencing)
        if: always() && steps.preflight.outputs.proceed == 'true'
        run: |
          set -euo pipefail
          python scripts/review/progress.py || true
          python scripts/review/gap-report.py || true
          python scripts/review/build-spot-worklist.py || true
          python scripts/review/build-cluster-worklist.py || true
          if ! git diff --quiet; then
            git add -A
            git commit -m "review: progress checkpoint"
            git push origin "HEAD:$BRANCH" || (git pull --rebase origin "$BRANCH" && git push origin "HEAD:$BRANCH")
          fi

      - name: Pace, then re-dispatch next chunk
        if: always() && steps.preflight.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "${{ inputs.redispatch }}" != "true" ]; then
            echo "redispatch=false — stopping here."; exit 0
          fi
          if [ -f STOP ]; then echo "STOP appeared — not re-dispatching."; exit 0; fi
          pending=$(python scripts/review/next-note.py --count)
          if [ "$pending" = "0" ]; then echo "Worklist drained — chain complete."; exit 0; fi
          chain=${{ inputs.chain_count }}
          if [ "$chain" -ge 200 ]; then
            echo "::warning::chain_count cap (200) reached — not re-dispatching."; exit 0
          fi
          real=$(git rev-list --count --invert-grep --grep='^review: progress checkpoint' "${{ steps.preflight.outputs.run_base }}..HEAD")
          if [ "$real" = "0" ]; then
            echo "::warning::Zero non-checkpoint commits this run (API outage / agent failure)."
            echo "Not self-re-dispatching — a human or a later manual dispatch must resume."
            exit 0
          fi
          pace="${PACE_OVERRIDE:-${{ inputs.pace_minutes }}}"
          if [ "$pace" -gt 0 ]; then
            echo "Pacing: sleeping ${pace} minute(s) before the next chunk."
            sleep $(( pace * 60 ))
          fi
          if [ -f STOP ]; then echo "STOP appeared during pause — not re-dispatching."; exit 0; fi
          for delay in 0 10 30 90; do
            sleep "$delay"
            if gh workflow run review-chunk.yml --ref "$BRANCH" \
                 -f chunk_budget="${BUDGET_OVERRIDE:-${{ inputs.chunk_budget }}}" \
                 -f pace_minutes="${{ inputs.pace_minutes }}" \
                 -f chain_count="$((chain + 1))" \
                 -f redispatch=true; then
              echo "Re-dispatched (chain depth $((chain + 1)))."; exit 0
            fi
          done
          echo "::warning::Re-dispatch failed after retries — chain has stalled."
