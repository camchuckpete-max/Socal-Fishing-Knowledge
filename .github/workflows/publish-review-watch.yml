name: publish-review-watch

# Rebuilds Review Watch (the editorial-review dashboard) from the review
# branch and deploys it to GitHub Pages, so the page refreshes itself while
# the chain works instead of needing a Claude session to regenerate it.
# Successor to publish-bight-watch.yml (batch 3, retired) on the same Pages
# site. Live at https://camchuckpete-max.github.io/Socal-Fishing-Knowledge/
#
# Cameron's review surface for the transform job, v3.4 (2026-08-26): the
# Bight Watch chassis, now with a Map view — all 391 charted spots pinned at
# their real coordinates with the jurisdiction/region/zone hierarchy drawn as
# colours and hulls, and a pin click that opens the spot's article or, where
# it is not written yet, everything the KB already knows about the place.
# Basemap defaults to the Esri ocean base because most of these spots are
# offshore and bathymetry is what explains them; OSM streets are one click
# away for ports and the coastal zones.
#
# v3.4: clicking a pin appeared to do nothing. Three faults, stacked:
#   1. The slide-over carried z-index:20 while Leaflet's panes run to 400 and
#      the map chrome sits at 1200 — so the article opened correctly every
#      time and was PAINTED UNDER the map. Zooming clears the panes for a
#      frame, which is the split second it could be seen.
#   2. The per-marker click handler raced the map's background handler: the
#      marker click built the overlap chooser, then the map click cleared it
#      in the same frame. One handler on the map now owns every click.
#   3. A pin is 4px across, so a miss by 5px counted as a background click.
#      Anything within 14px now counts, nearest first, capped at 8 — the
#      Coronados put 15 spots inside one click radius at region zoom.
#
# Leaflet is vendored + inlined by the builder, so the page carries no runtime
# CDN dependency. Map TILES are fetched at view time, which is why this lives
# on Pages rather than as a published Claude Artifact (whose CSP blocks
# external tile hosts).
#
# The rest of the chassis: sonar map, rail, slide-over reader with per-note
# Article / Before / Changes / Evidence tabs, cite-conservation checks,
# adjudication queues, and passage-level review notes exported as one
# markdown feedback block.

on:
  # Freshness comes from the event, not the clock: a chunk finishing is the
  # moment the page has something new to show. NOTE: this trigger has never
  # actually fired — workflow_run resolves against the DEFAULT-branch registry
  # and every chunk runs on the review branch — so review-chunk.yml dispatches
  # this workflow directly at the end of each chunk instead. Kept for the day
  # the review branch merges and the chunks run from main.
  workflow_run:
    workflows: ["review-chunk"]
    types: [completed]

  # Safety net for supervised pushes and chunks that die before reporting.
  # Deliberately hourly — see publish-bight-watch.yml's history: greedier
  # crons get throttled into being LESS fresh.
  schedule:
    - cron: "7 * * * *"

  workflow_dispatch:
    inputs:
      branch:
        description: Branch to build the snapshot from
        required: false
        default: claude/knowledge-base-review-g00k8s

  # Immediate kick: touching this file rebuilds now (a session without
  # actions:write cannot dispatch).
  push:
    paths:
      - .github/workflows/publish-review-watch.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the review branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || 'claude/knowledge-base-review-g00k8s' }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch recent chain runs for the Chain card
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/actions/workflows/review-chunk.yml/runs?per_page=12" \
            --jq '{workflow_runs: [.workflow_runs[] | {id, status, conclusion, created_at}]}' \
            > /tmp/runs.json || echo '{"workflow_runs":[]}' > /tmp/runs.json

      - name: Build the page
        run: |
          # checkout narrows the refspec to the branch it fetched; the diff
          # base (origin/main) must be asked for by name or every note reads
          # as unchanged.
          git fetch origin +refs/heads/main:refs/remotes/origin/main
          git rev-parse --short origin/main
          mkdir -p _site
          python scripts/build-review-watch.py --out _site/index.html --runs /tmp/runs.json
          ls -la _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
